# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for missing information or confirmation. Always pass response_type explicitly: text for a missing handle or URL, yes_no before send/post/publish, and choice only when options are supplied."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "A concise question that requests only the missing information or confirmation."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Pass explicitly. Use text for a missing value, yes_no for confirmation, or choice with options."}
        options: {type: array, default: [], items: {type: string}, description: "Choices used only when response_type=choice."}
      required: [question]

  - name: timeline
    description: "Get recent posts from a single account when the user asks for posts by a named person or account. Not for posts about a topic; use social_search for topic or keyword requests."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @. Map explicit well-known names, such as Sam Altman to sama, Elon Musk to elonmusk, and Andrej Karpathy to karpathy."}
        limit: {type: integer, default: 5, description: "Number of posts. Preserve an explicit user limit and later corrections."}
      required: [screenname]

  - name: social_search
    description: "Search social posts about a topic or keyword. Not for a single account timeline. Use search_type=Top for popular or top posts and Latest otherwise."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword exactly requested by the user."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Use Top for popular/top requests; use Latest otherwise."}
        limit: {type: integer, default: 5, description: "Number of posts. Preserve an explicit user limit."}
      required: [query]

  - name: lookup
    description: "Search the web or news. Use for general web research and current news, not social posts and not an explicit URL that should use fetch."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Subject only. Do not append words such as news when topic already carries that intent."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use topic=news for news or current-event requests; otherwise use general."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Map today=day, this week=week, this month=month, and this year=year. Preserve it across turns unless corrected."}
        max_results: {type: integer, default: 5, description: "Maximum number of web results."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send plain text to the configured Telegram destination only after the user explicitly confirmed the exact text and destination in the current conversation. For an unconfirmed send/post/publish request, call clarify with response_type=yes_no instead of this tool."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact non-empty plain-text message confirmed by the user."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit user confirmation in the current conversation."}
      required: [text, confirmed]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: dedupe
    description: "Remove duplicate research items after the items have already been collected. Preserve the first occurrence and original order. Never use this as an initial search tool."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Research items that have already been collected."
          items:
            type: object
      required: [items]

  - name: compare_sources
    description: "Compare structured claims from research items already collected. Report agreement and conflicting values by claim. Never use this as an initial search or as proof that a source is correct."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Collected source items. Each item should include source, optional url, and a claims object mapping claim names to reported values."
          items:
            type: object
            properties:
              source: {type: string}
              url: {type: string}
              title: {type: string}
              claims:
                type: object
                description: "Structured claim-name to reported-value mapping."
      required: [items]

  - name: citation_audit
    description: "Audit citations after claims have been assembled. Check each claim for non-empty text, a valid HTTP(S) URL, and a named source. This does not open URLs or prove that a citation supports a claim."
    parameters:
      type: object
      properties:
        claims:
          type: array
          default: []
          description: "Claims and their citations to validate."
          items:
            type: object
            properties:
              text: {type: string, description: "Claim text."}
              url: {type: string, description: "Citation URL."}
              source: {type: string, description: "Named source or publisher."}
      required: [claims]

  - name: export_report
    description: "Render already-collected research items into a final Markdown or JSON report. Returns content only; it does not write a file, search, verify citations, or send externally."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Report title. Defaults to Research Report."}
        items:
          type: array
          default: []
          description: "Final research items in desired output order."
          items:
            type: object
            properties:
              section: {type: string}
              title: {type: string}
              summary: {type: string}
              source: {type: string}
              url: {type: string}
        format: {type: string, enum: [markdown, json], default: "markdown", description: "Output serialization format."}
      required: [items, format]
